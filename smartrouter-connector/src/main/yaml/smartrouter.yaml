          type: string
          format: date-time
          nullable: true
        lastToggledBy:
          type: string
          nullable: true
    KillSwitchUpdateRequest:
      type: object
      description: Existing wire shape (ConfigDomainController.KillSwitchUpdateRequest).
      properties:
        enabled:
          type: boolean
