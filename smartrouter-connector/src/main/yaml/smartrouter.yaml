          type: integer
        to:
          type: integer
        changes:
          type: array
          items:
            type: object
            properties:
              op:
                type: string
                enum:
                - added
                - removed
                - changed
                - moved
              path:
                type: string
                example: /spec/rules[id=r1]/when
              from: {}
              to: {}
    RollbackRequest:
      type: object
      additionalProperties: false
      required:
      - toVersion
      properties:
        toVersion:
          type: integer
          minimum: 1
    RoutingPolicyOrder:
      type: object
      additionalProperties: false
      required:
      - apiVersion
