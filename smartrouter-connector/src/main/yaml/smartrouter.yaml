          type: string
          format: date-time
          nullable: true
    ServicesLookup:
      type: object
      properties:
        target:
          type: string
        items:
          type: array
          items:
            type: object
            properties:
              engine:
                type: string
                enum:
                - spark
                - hive
                - impala
                - trino
              endpoint:
                type: string
                description: Endpoint the router routes this engine to on the target, reduced to scheme, host(s), port(s)
                  and path; userinfo, query, fragment and JDBC ;key=value session properties are removed. Omitted when
                  there is none or it is not safely parseable.
                example: jdbc:impala://impala-cloud.example.com:443/
    RoutingGuardrail:
      type: object
      additionalProperties: false
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      properties:
        apiVersion:
          type: string
          enum:
          - smartrouter.cloudera.com/v1
        kind:
          type: string
          enum:
          - RoutingGuardrail
        metadata:
          $ref: '#/components/schemas/PolicyMetadata'
        spec:
          type: object
          additionalProperties: false
