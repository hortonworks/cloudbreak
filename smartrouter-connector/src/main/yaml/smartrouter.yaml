        apiVersion:
          type: string
          enum:
          - smartrouter.cloudera.com/v1
        kind:
          type: string
          enum:
          - QueueRegistry
        metadata:
          type: object
          additionalProperties: false
          description: Read-only; ignored on PUT
          properties:
            version:
              type: integer
              format: int64
            updatedAt:
              type: string
              format: date-time
              nullable: true
            updatedBy:
              type: string
              nullable: true
        spec:
          type: object
