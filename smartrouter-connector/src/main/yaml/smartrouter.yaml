          example: https://cm.example.com:7183
    BurstTargetsLookup:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              clusterId:
                type: string
              environment:
                type: string
              status:
                $ref: '#/components/schemas/Health'
              services:
                type: array
                items:
                  type: string
                  enum:
                  - spark
                  - hive
                  - impala
                  - trino
              role:
                type: string
                nullable: true
        observedAt:
          type: string
          format: date-time
    QueuesLookup:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              burstable:
                type: boolean
              source:
                type: string
        inventory:
          type: string
          description: loaded (YARN queue list read) or unavailable; burstability comes from the queue registry
          enum:
          - loaded
          - unavailable
