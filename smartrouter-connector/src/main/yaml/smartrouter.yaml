          - warn
          - fail
          - skipped
        message:
          type: string
        path:
          type: string
          description: JSON pointer
        ruleId:
          type: string
        line:
          type: integer
        column:
          type: integer
    SimulationRequest:
      type: object
      additionalProperties: false
      required:
      - mode
      - input
      properties:
        mode:
          type: string
          enum:
          - single
          - chain
        policy:
          $ref: '#/components/schemas/RoutingPolicy'
        placement:
          type: object
          properties:
            anchor:
              $ref: '#/components/schemas/ResourceName'
            position:
              type: string
              enum:
              - before
              - after
        input:
          $ref: '#/components/schemas/Activation'
        inputMeta:
          type: object
          description: Keyed by JSON pointer into input.
          additionalProperties:
            type: object
            properties:
              observedAt:
                type: string
                format: date-time
              confidence:
                type: number
                minimum: 0
                maximum: 1
    SimulationResponse:
      type: object
