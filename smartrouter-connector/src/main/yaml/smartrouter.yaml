      - spec
      properties:
        apiVersion:
          type: string
          enum:
          - smartrouter.cloudera.com/v1
        kind:
          type: string
          enum:
          - RoutingPolicyOrder
        metadata:
          type: object
          properties:
            version:
              type: integer
              format: int64
        spec:
