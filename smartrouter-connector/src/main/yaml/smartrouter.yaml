                  type: string
                kind:
                  type: string
                  enum:
                  - burst
                  - default
            decidedBy:
              type: object
              properties:
                layer:
                  type: string
                  enum:
                  - killSwitch
                  - guardrail
                  - override
                  - policy
                  - systemDefault
                name:
                  type: string
                version:
                  type: integer
                ruleId:
                  type: string
                reason:
                  type: string
        trace:
          type: array
