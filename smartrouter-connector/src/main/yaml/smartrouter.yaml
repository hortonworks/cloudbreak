          items:
            type: object
            required:
            - path
            - type
            - operators
            - status
            properties:
              path:
                type: string
                example: capacity.onprem.utilizationPct
              label:
                type: string
              kind:
                type: string
                enum:
                - context
                - fact
                - derived
              type:
                type: string
                enum:
                - bool
                - int
                - double
                - string
              unit:
                type: string
              min:
                type: number
              max:
                type: number
              values:
                type: array
                items:
                  type: string
              operators:
                type: array
                items:
                  type: string
              status:
                type: string
                enum:
                - available
                - planned
    PresetsResponse:
      type: object
      properties:
        compilerVersion:
          type: string
        presets:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                enum:
                - cost-saver
                - balanced
                - performance
              label:
                type: string
              description:
                type: string
              defaultAggressivenessPct:
                type: integer
    ApplyResponse:
      type: object
      properties:
        dryRun:
          type: boolean
        planHash:
          type: string
        results:
          type: array
          items:
            type: object
            properties:
              kind:
                type: string
                enum:
                - RoutingPolicy
                - RoutingGuardrail
                - RoutingPolicyOrder
              name:
                type: string
              action:
                type: string
                enum:
                - create
                - update
                - unchanged
              version:
                type: integer
    Health:
      type: string
      enum:
      - connected
      - degraded
      - unreachable
      - unknown
    DefaultTargetLookup:
      type: object
      properties:
        clusterId:
          type: string
        placement:
          type: string
          enum:
          - cloud
          - onprem
        health:
          $ref: '#/components/schemas/Health'
        services:
          type: array
          items:
            type: string
            enum:
            - spark
            - hive
            - impala
            - trino
        observedAt:
          type: string
          format: date-time
        environment:
          type: string
        cmEndpoint:
          type: string
