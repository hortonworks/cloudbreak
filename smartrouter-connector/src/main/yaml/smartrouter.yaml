          - performance
        aggressivenessPct:
          type: integer
          minimum: 0
          maximum: 100
        scopes:
          $ref: '#/components/schemas/PolicyScopes'
        targets:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/TargetRef'
    MaterializeObjectiveResponse:
      type: object
      properties:
        objective:
          $ref: '#/components/schemas/Objective'
        rules:
          type: array
          items:
            $ref: '#/components/schemas/PolicyRule'
    FieldCatalog:
      type: object
