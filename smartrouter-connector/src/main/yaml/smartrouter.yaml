          - created
          - updated
          - enabled
          - disabled
          - scoped
          - unscoped
          - retargeted
          - locked
          - unlocked
          - rolledBack
          - applied
          - deleted
        comment:
          type: string
          nullable: true
        policySetGeneration:
          type: integer
          format: int64
        at:
          type: string
          format: date-time
        by:
