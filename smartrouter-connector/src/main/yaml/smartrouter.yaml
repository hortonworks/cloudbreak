        decidedBy:
          type: object
          description: The deciding chain entry; policy fields are present only when a user policy decided.
          properties:
            layer:
              type: string
              enum:
              - killSwitch
              - guardrail
              - override
              - policy
              - systemDefault
            name:
              type: string
            version:
              type: integer
            ruleId:
              type: string
            position:
              type: integer
              description: Position of the deciding policy in the evaluation order at decision time.
        trace:
          type: array
          items:
            $ref: '#/components/schemas/TraceEntry'
    TraceEntry:
      type: object
      properties:
        layer:
          type: string
          enum:
          - killSwitch
          - guardrail
          - override
          - policy
          - systemDefault
        name:
          type: string
        position:
          type: integer
        status:
          type: string
          enum:
          - pass
          - armed
          - matched
          - notMatched
          - skipped
          - unresolvable
          - ignored
          - notEvaluated
        skipReason:
          type: string
          enum:
          - disabled
          - needsScope
          - outOfScope
          - invalid
        terminal:
          type: boolean
        rules:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              result:
                type: string
                enum:
                - 'true'
                - 'false'
                - error
                - unresolvable
        detail:
          type: string
    MaterializeObjectiveRequest:
      type: object
