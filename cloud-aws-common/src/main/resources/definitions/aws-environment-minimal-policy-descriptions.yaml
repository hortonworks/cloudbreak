# Permission descriptions for aws-environment-minimal-policy.json
# Keep in sync with the IAM policy JSON; validated by AwsPolicyPermissionDescriptionsTest.
policyFile: aws-environment-minimal-policy.json
title: AWS Cloudera platform environment minimal policy
summary: Narrower IAM policy Cloudera platform exposes as the Environment entry in granular credential prerequisites (AwsCredentialConnector.collectNecessaryGranularPolicies). Intended for environment credentials; delete and modify on many resource types require the Cloudera-Resource-Name tag (crn:cdp:*). Cloudera platform uses it when simulating and applying permissions via AwsCredentialVerifier.
permissions:
  "autoscaling:CreateAutoScalingGroup": "Cloudera platform creates ASGs for environment host groups."
  "autoscaling:DeleteAutoScalingGroup": "Cloudera platform deletes ASGs created for environment host groups (crn:cdp:* tag)."
  "autoscaling:DescribeAutoScalingGroups": "Cloudera platform reads ASG state for environment host groups."
  "autoscaling:DescribeScalingActivities": "Cloudera platform reads scaling history for environment troubleshooting."
  "autoscaling:DetachInstances": "Cloudera platform detaches instances from environment ASGs (crn:cdp:* tag)."
  "autoscaling:ResumeProcesses": "Cloudera platform resumes ASG processes after maintenance (crn:cdp:* tag)."
  "autoscaling:SuspendProcesses": "Cloudera platform suspends ASG processes during environment maintenance (crn:cdp:* tag)."
  "autoscaling:TerminateInstanceInAutoScalingGroup": "Cloudera platform terminates instances in environment ASGs during scale-in."
  "autoscaling:UpdateAutoScalingGroup": "Cloudera platform updates environment ASG capacity (crn:cdp:* tag)."
  "cloudformation:CreateStack": "Cloudera platform creates environment CloudFormation stacks; new resources must be tagged Cloudera-Resource-Name crn:cdp:* on create."
  "cloudformation:DeleteStack": "Cloudera platform deletes environment stacks; allowed only when stack/resources carry the crn:cdp:* tag."
  "cloudformation:DescribeStackEvents": "Cloudera platform surfaces stack events to operators when environment deployment fails."
