  "cloudformation:GetTemplate": "Cloudera platform reads templates for stacks it launches for environments (request the crn:cdp:* tag on create)."
  "cloudformation:ListStackResources": "Cloudera platform enumerates stack members when reconciling environment infrastructure."
  "cloudformation:UpdateStack": "Cloudera platform updates environment stacks during resize or configuration changes."
