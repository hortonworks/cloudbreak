# Permission descriptions for aws-cb-policy.json
# Keep in sync with the IAM policy JSON; validated by AwsPolicyPermissionDescriptionsTest.
policyFile: aws-cb-policy.json
title: AWS Cloudera platform cross-account credential policy
summary: IAM policy document Cloudera platform ships as policyJson in AwsCredentialConnector credential prerequisites for the customer cross-account role. Cloudera platform assumes that role to launch CloudFormation stacks (cloud-aws-cloudformation) and manage EC2, RDS, load balancers, and related resources for environments, Data Hub, and FreeIPA.
permissions:
  "acm:AddTagsToCertificate": "Cloudera platform tags TLS certificates it requests for load balancers created in customer stacks."
  "acm:DeleteCertificate": "Cloudera platform deletes ACM certificates when tearing down environment ingress it provisioned."
  "acm:DescribeCertificate": "Cloudera platform checks certificate issuance status while configuring HTTPS on ELBs from templates."
  "acm:GetCertificate": "Cloudera platform retrieves issued certificates to attach to listeners created by its load balancer connector."
  "acm:ListCertificates": "Cloudera platform lists certificates when reusing or validating TLS assets for an environment."
  "acm:ListTagsForCertificate": "Cloudera platform reads certificate tags for resources it manages."
  "acm:RenewCertificate": "Cloudera platform renews ACM certificates tied to long-lived environment endpoints."
  "acm:RequestCertificate": "Cloudera platform requests ACM certificates for HTTPS endpoints defined in CloudFormation."
  "autoscaling:*": "Cloudera platform manages auto scaling groups attached to Data Hub host groups created from its templates."
  "cloudformation:*": "Cloudera platform creates, updates, and deletes CloudFormation stacks that materialize environment and cluster templates from cloud-aws-cloudformation."
  "cloudwatch:DeleteAlarms": "Cloudera platform removes alarms it created when deleting environment or cluster stacks."
  "cloudwatch:DescribeAlarms": "Cloudera platform lists alarms while reconciling stack resources during provision and delete flows."
  "cloudwatch:ListTagsForResource": "Cloudera platform reads tags on CloudWatch alarms when reconciling user-defined tag updates."
  "cloudwatch:PutMetricAlarm": "Cloudera platform publishes CloudWatch alarms defined in its CloudFormation templates for stack health monitoring."
  "cloudwatch:TagResource": "Cloudera platform applies user-defined and Cloudera-Resource-Name tags to CloudWatch alarms created for stack health monitoring."
  "cloudwatch:UntagResource": "Cloudera platform removes tags from CloudWatch alarms during user-defined tag updates on environment and cluster stacks."
  "ec2:*": "Cloudera platform EC2 and network connectors provision and manage the lifecycle of Data Hub/FreeIPA instances, security groups, volumes, and VPC resources in the customer account."
  "ecr:DescribeImages": "Cloudera platform lists image tags available for Kubernetes node and add-on provisioning."
  "ecr:DescribeRepositories": "Cloudera platform discovers ECR repositories when pulling images required by EKS templates."
  "ecr:GetAuthorizationToken": "Cloudera platform obtains ECR login tokens for image pulls during EKS cluster setup."
  "eks:*": "Cloudera platform provisions and operates EKS clusters where Kubernetes-based platform features are enabled in the deployment."
  "elasticfilesystem:*": "Cloudera platform creates EFS mounts when shared filesystem storage is required by the provisioned stack."
  "elasticloadbalancing:*": "Cloudera platform configures load balancers and target groups fronting cluster endpoints during stack provisioning and teardown."
  "iam:AddRoleToInstanceProfile": "Cloudera platform associates roles to instance profiles during node group provisioning."
  "iam:AttachRolePolicy": "Cloudera platform attaches policies to IAM roles it creates for instance profiles in stacks."
  "iam:CreateInstanceProfile": "Cloudera platform creates instance profiles referenced by launch templates in CloudFormation."
  "iam:CreateRole": "Cloudera platform creates IAM roles for cluster nodes and services defined in stack templates."
  "iam:CreateServiceLinkedRole": "Cloudera platform creates AWS service-linked roles required by RDS/ELB resources in its stacks."
  "iam:DeleteInstanceProfile": "Cloudera platform deletes instance profiles during stack teardown."
  "iam:DeleteRole": "Cloudera platform deletes roles it created when removing environment infrastructure."
  "iam:DeleteRolePolicy": "Cloudera platform removes inline policies from roles during teardown."
  "iam:DetachRolePolicy": "Cloudera platform detaches managed policies from roles it provisioned."
  "iam:GetInstanceProfile": "Cloudera platform reads instance profiles when launching instances from templates."
  "iam:GetRole": "Cloudera platform fetches role metadata for ARNs embedded in CloudFormation parameters."
  "iam:GetRolePolicy": "Cloudera platform reads inline policies while reconciling IAM resources for a stack."
  "iam:ListAttachedRolePolicies": "Cloudera platform lists attached policies on roles used by provisioned hosts."
  "iam:ListInstanceProfiles": "Cloudera platform lists instance profiles when binding roles to auto scaling groups."
  "iam:ListRolePolicies": "Cloudera platform lists inline policies on roles it manages during credential validation."
  "iam:ListRoles": "Cloudera platform lists roles while resolving instance profile ARNs for provisioning."
  "iam:PassRole": "Cloudera platform passes instance/service roles to EC2 and auto scaling when RunInstances and ASG resources are created."
  "iam:PutRolePolicy": "Cloudera platform adds inline policies to roles created for stack workloads."
  "iam:RemoveRoleFromInstanceProfile": "Cloudera platform disassociates roles during profile cleanup on delete."
  "iam:SimulatePrincipalPolicy": "Cloudera platform simulates this policy in AwsCredentialVerifier when customers validate AWS credentials."
  "iam:TagRole": "Cloudera platform tags IAM roles using AwsTaggingService for Cloudera resource tracking."
  "iam:UntagRole": "Cloudera platform removes tags from roles during decommissioning."
  "kms:CreateAlias": "Cloudera platform creates KMS aliases for keys used by encrypted resources in templates."
  "kms:CreateGrant": "Cloudera platform issues grants so AWS services can use KMS keys for encrypted volumes and secrets."
  "kms:CreateKey": "Cloudera platform creates KMS keys for volume and secret encryption in customer environments."
  "kms:Decrypt": "Cloudera platform decrypts with keys it manages when reading encrypted configuration or storage."
  "kms:DeleteAlias": "Cloudera platform deletes aliases when removing keys created for an environment."
  "kms:DescribeKey": "Cloudera platform describes keys referenced in encryption settings for stacks."
  "kms:EnableKeyRotation": "Cloudera platform enables rotation on keys it provisions for long-lived environments."
  "kms:Encrypt": "Cloudera platform encrypts data with customer-managed keys used in provisioning flows."
  "kms:GenerateRandom": "Cloudera platform generates entropy for key material where templates require it."
  "kms:ListAliases": "Cloudera platform resolves key aliases configured in environment encryption settings."
  "kms:ListKeyPolicies": "Cloudera platform reads key policies while attaching stack roles to KMS keys."
  "kms:ListKeys": "Cloudera platform lists keys when selecting encryption for new environment resources."
  "kms:PutKeyPolicy": "Cloudera platform updates key policies so cluster roles can use encryption keys."
  "kms:ScheduleKeyDeletion": "Cloudera platform schedules key deletion when removing environment encryption assets."
  "kms:TagResource": "Cloudera platform tags KMS keys created for environment encryption."
  "logs:CreateLogGroup": "Cloudera platform creates log groups used by platform logging for stacks it deploys."
  "logs:CreateLogStream": "Cloudera platform writes EKS control-plane log streams for clusters it provisions (/aws/eks/* path in policy)."
  "logs:DescribeLogStreams": "Cloudera platform inspects EKS log streams when validating logging setup for managed clusters."
  "logs:PutLogEvents": "Cloudera platform ships log events to EKS log groups during cluster bring-up."
  "logs:PutRetentionPolicy": "Cloudera platform sets retention on log groups created for EKS clusters it manages."
  "pi:*": "Cloudera platform reads RDS Performance Insights metrics for databases it manages in customer accounts."
  "pricing:GetProducts": "Cloudera platform queries AWS Price List when estimating instance costs in platform APIs."
  "rds:*": "Cloudera platform provisions and manages RDS instances (for example, embedded database or FreeIPA database) through its AWS resource connectors."
  "route53:AssociateVPCWithHostedZone": "Cloudera platform wires private hosted zones to customer VPCs for in-environment DNS used by clusters."
  "route53:ChangeResourceRecordSets": "Cloudera platform registers DNS records for services exposed from environments it provisions."
  "route53:CreateHostedZone": "Cloudera platform creates private zones when environment networking requires managed DNS."
  "route53:GetChange": "Cloudera platform polls Route53 change status after updating records for an environment."
  "route53:ListHostedZones": "Cloudera platform discovers existing hosted zones when attaching environment DNS."
  "route53:ListHostedZonesByName": "Cloudera platform resolves zones by name during environment DNS configuration."
  "route53:ListResourceRecordSets": "Cloudera platform reads record sets when synchronizing environment DNS state."
  "s3:AbortMultipartUpload": "Cloudera platform aborts failed multipart uploads to buckets referenced in environment/log locations."
  "s3:CreateBucket": "Cloudera platform creates buckets when templates require dedicated storage for logs or bootstrap data."
  "s3:DeleteBucket": "Cloudera platform deletes buckets it created during environment deletion workflows."
  "s3:DeleteObject": "Cloudera platform removes objects from buckets it manages during cleanup."
  "s3:GetBucketLocation": "Cloudera platform resolves bucket region when wiring S3 locations into environment definitions."
  "s3:GetEncryptionConfiguration": "Cloudera platform reads encryption settings when configuring secure storage for environments."
  "s3:GetObject": "Cloudera platform reads objects from customer buckets used by provisioning (scripts, metadata)."
  "s3:ListBucket": "Cloudera platform lists bucket contents when validating storage locations for an environment."
  "s3:PutBucketPublicAccessBlock": "Cloudera platform enforces public access blocks on buckets created by its templates."
  "s3:PutBucketTagging": "Cloudera platform applies S3 bucket tags using AwsTaggingService for resources it creates."
  "s3:PutEncryptionConfiguration": "Cloudera platform sets default encryption on buckets provisioned for environment storage."
  "s3:PutObject": "Cloudera platform writes bootstrap or log objects to buckets used during provisioning."
  "secretsmanager:CreateSecret": "Cloudera platform stores secrets for credential and encryption flows in customer accounts."
  "secretsmanager:DeleteSecret": "Cloudera platform deletes secrets it created when removing environment encryption assets."
  "secretsmanager:DescribeSecret": "Cloudera platform reads secret metadata for stack-managed credentials."
  "secretsmanager:GetSecretValue": "Cloudera platform retrieves secret values needed during provisioning or rotation."
  "secretsmanager:PutResourcePolicy": "Cloudera platform sets secret resource policies for cross-service access from stacks."
  "secretsmanager:TagResource": "Cloudera platform tags secrets with Cloudera-Resource-Name using AwsTaggingService."
  "secretsmanager:UpdateSecret": "Cloudera platform updates secret payloads during credential or encryption rotation."
  "servicequotas:ListServiceQuotas": "Cloudera platform checks service quotas before provisioning large environments."
  "ssm:DescribeParameters": "Cloudera platform reads SSM parameters for EKS optimized AMI metadata used in templates."
  "ssm:GetParameter": "Cloudera platform fetches SSM parameters (EKS AMI paths) during EKS provisioning."
  "ssm:GetParameterHistory": "Cloudera platform inspects parameter history when diagnosing EKS AMI drift."
  "ssm:GetParameters": "Cloudera platform batch-reads SSM parameters for EKS AMI selection."
  "ssm:GetParametersByPath": "Cloudera platform loads EKS AMI parameters under /aws/service/eks/optimized-ami/* to create clusters."
  "sts:DecodeAuthorizationMessage": "Cloudera platform decodes STS errors users encountered during AwsAuthenticator credential checks."
  "vpce:AllowMultiRegion": "Cloudera platform enables multi-region VPC endpoint configuration for private access patterns in advanced networking setups."
