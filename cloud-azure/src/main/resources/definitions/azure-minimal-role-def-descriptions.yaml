# Permission descriptions for azure-minimal-role-def.json
# Keep in sync with the custom role JSON; validated by AzurePolicyPermissionDescriptionsTest.
policyFile: azure-minimal-role-def.json
title: Azure Cloudera platform environment minimal custom role (single resource group)
summary: Narrower custom role JSON Cloudera platform exposes as MinimalRoleDefinition in granular credential prerequisites (AzureCredentialConnector). Scoped to one resource group for minimal Azure environment credentials. Azure connectors use these Actions and DataActions when deploying environment stacks within the assigned resource group.
