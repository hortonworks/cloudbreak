# Permission descriptions for azure-role-def.json
# Keep in sync with the custom role JSON; validated by AzurePolicyPermissionDescriptionsTest.
policyFile: azure-role-def.json
title: Azure Cloudera platform environment custom role (subscription scope)
summary: Custom role JSON Cloudera platform exposes as roleDefinitionJson in AzureCredentialConnector credential prerequisites (base64-encoded). Used with azure-prerequisites-creation-command.json to create the Cloudera Management Console Azure Operator role at subscription scope. Azure connectors use these Actions and DataActions when provisioning and tearing down environment compute, networking, databases, and storage.
permissions:
  "Microsoft.Authorization/*/read": "Cloudera platform reads role assignments and policy metadata when validating Azure environment credentials."
  "Microsoft.Compute/*/read": "Cloudera platform reads compute resource metadata (VMs, disks, images) during Azure environment sync and status reporting."
  "Microsoft.Compute/availabilitySets/*": "Cloudera platform creates, updates, and deletes availability sets for Azure environment host groups."
  "Microsoft.Compute/disks/*": "Cloudera platform manages managed disks attached to Azure environment cluster nodes."
  "Microsoft.Compute/images/*": "Cloudera platform publishes and manages custom images that launch Azure environment VMs."
  "Microsoft.Compute/virtualMachines/*": "Cloudera platform provisions, scales, and terminates VMs for Azure environment host groups using ARM templates."
  "Microsoft.DBforPostgreSQL/flexibleServers/configurations/write": "Cloudera platform adjusts PostgreSQL flexible server parameters during Azure environment database setup."
  "Microsoft.DBforPostgreSQL/flexibleServers/delete": "Cloudera platform deletes PostgreSQL flexible servers when tearing down Azure environments."
  "Microsoft.DBforPostgreSQL/flexibleServers/firewallRules/write": "Cloudera platform configures firewall rules on PostgreSQL flexible servers for environment connectivity."
  "Microsoft.DBforPostgreSQL/flexibleServers/read": "Cloudera platform reads Azure database for PostgreSQL flexible server metadata for environment databases."
  "Microsoft.DBforPostgreSQL/flexibleServers/start/action": "Cloudera platform starts stopped PostgreSQL flexible servers during Azure environment recovery."
  "Microsoft.DBforPostgreSQL/flexibleServers/stop/action": "Cloudera platform stops PostgreSQL flexible servers during Azure environment maintenance."
  "Microsoft.DBforPostgreSQL/flexibleServers/write": "Cloudera platform creates and updates PostgreSQL flexible servers for Azure environment database workloads."
  "Microsoft.DBforPostgreSQL/servers/virtualNetworkRules/write": "Cloudera platform links PostgreSQL servers to environment virtual networks using VNet rules."
  "Microsoft.DBforPostgreSQL/servers/write": "Cloudera platform creates and updates single-server PostgreSQL instances for legacy Azure environment stacks."
  "Microsoft.DataLakeStore/*/read": "Cloudera platform reads Data Lake Store metadata when legacy Azure datalake integrations are present."
  "Microsoft.Features/*/read": "Cloudera platform checks subscription feature registration before provisioning Azure environment resources."
  "Microsoft.ManagedIdentity/userAssignedIdentities/assign/action": "Cloudera platform assigns user-assigned managed identities to Azure environment VMs and services."
  "Microsoft.ManagedIdentity/userAssignedIdentities/read": "Cloudera platform reads managed identity metadata used by Azure environment credentials."
  "Microsoft.ManagedIdentity/userAssignedIdentities/write": "Cloudera platform creates user-assigned managed identities for Azure environment provisioning."
  "Microsoft.Network/*/read": "Cloudera platform reads Azure networking resources (VNets, NSGs, IPs) during environment sync."
  "Microsoft.Network/loadBalancers/backendAddressPools/join/action": "Cloudera platform joins environment VM NICs to load balancer backend pools for Azure ingress."
  "Microsoft.Network/loadBalancers/write": "Cloudera platform creates and updates load balancers fronting Azure environment cluster endpoints."
  "Microsoft.Network/networkInterfaces/*": "Cloudera platform manages NICs attached to Azure environment compute instances."
  "Microsoft.Network/networkSecurityGroups/*": "Cloudera platform creates and updates NSGs controlling traffic for Azure environment subnets."
  "Microsoft.Network/publicIPAddresses/*": "Cloudera platform allocates and attaches public IPs for Azure environment gateway and ingress nodes."
  "Microsoft.Network/virtualNetworks/*": "Cloudera platform creates and manages virtual networks and subnets for Azure environment networking."
  "Microsoft.ResourceHealth/*/read": "Cloudera platform reads Azure resource health events when diagnosing environment provisioning failures."
  "Microsoft.Resources/*/read": "Cloudera platform reads ARM resource metadata across the subscription for Azure environment reconciliation."
  "Microsoft.Resources/deployments/*": "Cloudera platform creates, updates, and deletes ARM deployments that materialize Azure environment infrastructure."
  "Microsoft.Resources/subscriptions/resourceGroups/*": "Cloudera platform creates and manages resource groups that host Azure environment stacks."
  "Microsoft.Storage/*/read": "Cloudera platform reads storage account and blob service metadata for Azure environment datalake and logs."
  "Microsoft.Storage/locations/deleteVirtualNetworkOrSubnets/action": "Cloudera platform removes stale VNet/subnet associations on storage accounts during Azure environment cleanup."
  "Microsoft.Storage/storageAccounts/blobServices/containers/*": "Cloudera platform manages blob containers used for Azure environment datalake and backup storage."
  "Microsoft.Storage/storageAccounts/blobServices/containers/blobs/*": "Cloudera platform reads, writes, and deletes blobs in environment storage containers (data plane)."
  "Microsoft.Storage/storageAccounts/blobServices/write": "Cloudera platform configures blob services on storage accounts provisioned for Azure environments."
  "Microsoft.Storage/storageAccounts/delete": "Cloudera platform deletes storage accounts when decommissioning Azure environment resources."
  "Microsoft.Storage/storageAccounts/listkeys/action": "Cloudera platform retrieves storage account keys to configure Azure environment cluster access."
  "Microsoft.Storage/storageAccounts/regeneratekey/action": "Cloudera platform rotates storage account keys during Azure environment credential maintenance."
  "Microsoft.Storage/storageAccounts/write": "Cloudera platform creates and updates storage accounts for Azure environment datalake and logs."
  "Microsoft.Support/*": "Cloudera platform opens Azure support tickets when automated environment diagnostics require vendor assistance."
