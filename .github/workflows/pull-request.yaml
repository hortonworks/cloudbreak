name: cloudbreak-pull-request-test

env:
  APP_NAME: cloudbreak
  namespace: cloudbreak-pr-${{github.event.number}}
  serviceversion: ${{github.sha}}
  PROJECT: cloudbreak/cloudbreak
  BRANCH: ${{github.base_ref}}
  SOURCE_BRANCH: ${{github.head_ref}}
  PULL_REQUEST_NUMBER: ${{ github.event.number }}
  GITHUB_RUN_ATTEMPT: ${{github.run_attempt}}
  GITHUB_ENV: true

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fetches the PR's current labels via the REST API at run time so that a manual
  # workflow re-run reflects any label changes made since the first run. Using
  # `github.event.pull_request.labels.*.name` in a job's `if:` reads the event
  # payload frozen at the original run, which is what we want to avoid here.
  # Downstream label-gated jobs consume `needs.resolve-labels.outputs.labels`.
  resolve-labels:
    permissions:
      pull-requests: read
    name: Resolve PR labels
    runs-on: [cb-ubuntu22]
    # No pull_request context on workflow_dispatch — skip and let label-gated
    # jobs stay skipped (matches prior behavior on manual dispatch).
    if: ${{ github.event.pull_request.number != '' }}
    outputs:
      labels: ${{ steps.fetch.outputs.labels }}
    steps:
      - name: Fetch current PR labels
        id: fetch
        run: |
          labels=$(curl -sSf \
            -H "Accept: application/json" \
            "https://github.infra.cloudera.com/api/v3/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" \
            | jq -r '[.labels[].name] | join(",")')
          echo "labels=${labels}" >> "$GITHUB_OUTPUT"
          echo "PR labels at run time: ${labels}"

  jira-update:
    permissions: write-all
    name: Jira Update
    runs-on: [cb-ubuntu22]
    env:
      PROJECT: cloudbreak/cloudbreak
      SOURCE_BRANCH: ${{github.head_ref}}
      PULL_REQUEST_NUMBER: ${{ github.event.number }}
    steps:
      - name: checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: prepare
        uses: ./.github/actions/pull-request/base
      - name: execute
        uses: ./.github/actions/pull-request/jira-update

  unit-test:
    permissions: write-all
    name: Unit Test
    runs-on: [cb-ubuntu22-medium]
    steps:
      - name: checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: prepare
        uses: ./.github/actions/pull-request/base
      - name: execute
        uses: ./.github/actions/pull-request/unit-test

  bootstrap-cert-filter-test:
    permissions: write-all
    name: Bootstrap Cert Filter Test
    runs-on: [cb-ubuntu22]
    steps:
      - name: checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: compile and run ImportCertsTest
        run: |
          javac -d /tmp/import-certs-test docker-common/bootstrap/ImportCerts.java docker-common/test/ImportCertsTest.java
          java -cp /tmp/import-certs-test ImportCertsTest
      - name: check per-service ImportCerts.java copies are in sync
        run: java docker-common/bootstrap/Sync.java --check

  checkstyle-main:
    permissions: write-all
    name: Checkstyle Main
    runs-on: [cb-ubuntu22]
    steps:
      - name: checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: prepare
        uses: ./.github/actions/pull-request/base
      - name: execute
        uses: ./.github/actions/pull-request/checkstyle-main

  checkstyle-test:
    permissions: write-all
    name: Checkstyle Test
    runs-on: [cb-ubuntu22]
    steps:
      - name: checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: prepare
        uses: ./.github/actions/pull-request/base
      - name: execute
        uses: ./.github/actions/pull-request/checkstyle-test

  spotbugs-test:
    permissions: write-all
    name: Spotbugs Test
    runs-on: [cb-ubuntu22]
    steps:
      - name: checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: prepare
        uses: ./.github/actions/pull-request/base
      - name: execute
        uses: ./.github/actions/pull-request/spotbugs-test

  spotbugs-main:
    permissions: write-all
    name: Spotbugs Main
    runs-on: [cb-ubuntu22]
    steps:
      - name: checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: prepare
        uses: ./.github/actions/pull-request/base
      - name: execute
        uses: ./.github/actions/pull-request/spotbugs-main

  auto-approve:
    permissions: write-all
    name: Auto Approve
    runs-on: [cb-ubuntu22]
    if: github.actor == 'dependabot[bot]' || github.actor == 'cloudbreak-jenkins'
    steps:
      - name: checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: prepare
        uses: ./.github/actions/pull-request/base
      - name: execute
        uses: ./.github/actions/pull-request/auto-approve

  swagger-compatiblity:
    permissions: write-all
    name: Swagger Compatibility
    runs-on: [cb-ubuntu22]
    steps:
      - name: checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: prepare
        uses: ./.github/actions/pull-request/base
      - name: execute
        uses: ./.github/actions/pull-request/swagger-compatiblity

  component-test:
    permissions: write-all
    name: Component Test
    runs-on: [cb-ubuntu22]
    steps:
      - name: checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: prepare
        uses: ./.github/actions/pull-request/base
      - name: execute
        uses: ./.github/actions/pull-request/component-test

  config-change-integration-test:
    permissions: write-all
    name: Config Change Integration Test
    runs-on: [cb-ubuntu22]
    steps:
      - name: checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: prepare
        uses: ./.github/actions/pull-request/base
      - name: execute
        uses: ./.github/actions/pull-request/config-change-integration-test

  schema-compatibility-test:
    permissions: write-all
    name: Schema Compatibility Test
    runs-on: [cb-ubuntu22-large]
    timeout-minutes: 90
    steps:
      - name: checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: prepare
        uses: ./.github/actions/pull-request/base
      - name: execute
        uses: ./.github/actions/pull-request/schema-compatibility-test

  integration-test:
    permissions: write-all
    name: Integration Test
    runs-on: [cb-ubuntu22-8xlarge]
    timeout-minutes: 90
    steps:
      - name: checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: prepare
        uses: ./.github/actions/pull-request/base
      - name: execute
        uses: ./.github/actions/pull-request/integration-test

  fedramp-integration-test:
    permissions: write-all
    name: FedRAMP Integration Test
    runs-on: [cb-ubuntu22-large]
    timeout-minutes: 90
    # Opt-in: only run when the PR carries the `fedramp-it` label. Without it the job's
    # own script is a no-op ("no need for build"), so skipping the whole job avoids the
    # runner spin-up. A job-level skip reports "skipped" (counts as passing for branch
    # protection), unlike a workflow/path skip which would stay pending and block merge.
    # Label list is resolved live in `resolve-labels` so re-runs see the current labels.
    needs:
      - resolve-labels
    if: ${{ contains(needs.resolve-labels.outputs.labels, 'fedramp-it') }}
    steps:
      - name: checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: prepare
        uses: ./.github/actions/pull-request/base
      - name: execute
        uses: ./.github/actions/pull-request/fedramp-integration-test

  real-ums-test:
    permissions: write-all
    name: Real UMS Test
    runs-on: [cb-ubuntu22-large]
    timeout-minutes: 90
    # Opt-in: only run when the PR carries the `real_ums_test` label. Without it the job's
    # own script is a no-op ("no need for build"), so skipping the whole job avoids the
    # runner spin-up. A job-level skip counts as passing for branch protection.
    # Label list is resolved live in `resolve-labels` so re-runs see the current labels.
    needs:
      - resolve-labels
    if: ${{ contains(needs.resolve-labels.outputs.labels, 'real_ums_test') }}
    steps:
      - name: checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: prepare
        uses: ./.github/actions/pull-request/base
      - name: execute
        uses: ./.github/actions/pull-request/real-ums-test

  aws-test:
    permissions: write-all
    name: Aws Test
    runs-on: [cb-ubuntu22-large]
    timeout-minutes: 120
    # Opt-in: only run the real-AWS smoke suite when the PR carries one of the smoke labels.
    # Each label selects a suite in aws-test-steps_aws_test.sh (datahub > datalake >
    # environment). This is the expensive job (real infra, up to 120 min) that serializes
    # after the whole mock/static wave, so gating it saves the most PR time when unneeded.
    # Label list is resolved live in `resolve-labels` so re-runs see the current labels.
    if: >-
      ${{ contains(needs.resolve-labels.outputs.labels, 'aws-smoke-datahub-test')
          || contains(needs.resolve-labels.outputs.labels, 'aws-smoke-datalake-test')
          || contains(needs.resolve-labels.outputs.labels, 'aws-smoke-environment-test') }}
    # fedramp-integration-test and real-ums-test are intentionally NOT in `needs`: they are
    # now label-gated too, and a skipped `needs` dependency cascades (default success()
    # semantics) — keeping them here would skip aws-test even when a smoke label is present.
    needs:
      - resolve-labels
      - unit-test
      - bootstrap-cert-filter-test
      - checkstyle-main
      - checkstyle-test
      - spotbugs-test
      - spotbugs-main
      - swagger-compatiblity
      - component-test
      - config-change-integration-test
      - schema-compatibility-test
      - integration-test
    steps:
      - name: checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: prepare
        uses: ./.github/actions/pull-request/base
      - name: execute
        uses: ./.github/actions/pull-request/aws-test
