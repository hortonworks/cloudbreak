server:
  servlet:
    context-path: "/maintenance"
  shutdown: graceful
  tomcat:
    mbeanregistry:
      enabled: true

server.port: 8093

management:
  endpoints:
    web:
      base-path: "/"
      exposure:
        include: info,health,prometheus
      path-mapping:
        prometheus: metrics
  endpoint:
    metrics:
      enabled: true
      export:
        prometheus:
          enabled: true
    prometheus:
      enabled: true
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: "readinessState,hikariState"
  metrics:
    distribution:
      slo:
        "[http.server.requests]": "125ms, 250ms, 500ms, 1s, 2s"
      percentiles:
        "[http.server.requests]": "0.5, 0.95"
  info:
    env:
      enabled: true

maintenance:
  schema.migration.auto: true
  client.id: maintenance
  cert.dir: /certs/
  dispatcher:
    interval-minutes: 15
  db:
    port.5432.tcp.port: 5432
    port.5432.tcp.addr: 127.0.0.1
    env:
      user: postgres
      pass:
      db: maintenancedb
      schema: public
      cert.file: database.crt
      ssl: false
  etc.config.dir: /etc/maintenance

spring:
  application:
    name: MaintenanceService
  jpa:
    properties:
      hibernate:
        generate_statistics: true
        jdbc:
          batch_size: 400
        order_inserts: true
        order_updates: true
  lifecycle:
    timeout-per-shutdown-phase: 60s
  main:
    allow-circular-references: true

rest:
  debug: false

cert:
  validation: true
  ignorePreValidation: false

secret:
  application: maintenance/shared
  engine: "com.sequenceiq.cloudbreak.service.secret.vault.VaultKvV2Engine"

vault:
  addr: localhost
  port: 8200
  ssl.enabled: false
  kv.engine.v2.path: secret
  config.enabled: true
  auth:
    type: "token"
    kubernetes:
      service.account.token.path: /var/run/secrets/kubernetes.io/serviceaccount/token
      mount.path: "dps-dev"
      login.role: "cloudbreak.default"

altus:
  ums:
    host: localhost
    caller: maintenance

crn:
  partition: cdp
  region: us-west-1
