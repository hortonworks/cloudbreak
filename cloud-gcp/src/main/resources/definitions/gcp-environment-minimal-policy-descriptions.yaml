# Permission descriptions for gcp-environment-minimal-policy.json
# Keep in sync with the custom role JSON; validated by GcpPolicyPermissionDescriptionsTest.
policyFile: gcp-environment-minimal-policy.json
title: GCP Cloudera platform environment minimal custom role
summary: Custom IAM role JSON Cloudera platform exposes as MinimalPrerequisitesCreationPermissions in GcpCredentialConnector credential prerequisites (base64-encoded). Used with gcp-minimal-prerequisites-creation-command.json to create a project custom role for narrow GCP environment credentials. Cloudera platform GCP connectors use these permissions when provisioning and tearing down environment compute, networking, databases, and storage.
permissions:
  "cloudkms.cryptoKeyVersions.useToDecrypt": "Cloudera platform decrypts with customer KMS keys used by environment storage or secrets."
  "cloudkms.cryptoKeyVersions.useToEncrypt": "Cloudera platform encrypts data with KMS keys configured for GCP environment provisioning."
  "cloudkms.cryptoKeys.list": "Cloudera platform lists Cloud KMS crypto keys when wiring encryption for GCP environment resources."
  "cloudkms.keyRings.list": "Cloudera platform discovers KMS key rings available in the project for environment encryption setup."
  "cloudsql.instances.create": "Cloudera platform creates Cloud SQL instances for environment databases (for example, FreeIPA or embedded DB)."
  "cloudsql.instances.delete": "Cloudera platform deletes Cloud SQL instances when tearing down GCP environments."
  "cloudsql.instances.get": "Cloudera platform reads Cloud SQL instance metadata during environment status sync."
  "cloudsql.instances.list": "Cloudera platform lists Cloud SQL instances belonging to provisioned environments."
  "cloudsql.instances.restart": "Cloudera platform restarts Cloud SQL during environment database maintenance."
  "cloudsql.instances.startReplica": "Cloudera platform starts read replicas for environment database topologies."
